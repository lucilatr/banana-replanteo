name = "banana-replanteo"
main = "worker.js"
compatibility_date = "2024-11-01"

# Sirve la página estática desde ./public y expone el binding env.ASSETS al Worker
[assets]
directory = "./public"
binding = "ASSETS"

# Base de datos KV donde se guarda el board compartido.
# Reemplazá el id por el que te devuelva:  npx wrangler kv namespace create BOARD_KV
[[kv_namespaces]]
binding = "BOARD_KV"
id = "REEMPLAZAR_CON_TU_ID"
